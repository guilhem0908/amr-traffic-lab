[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-traffic-lab"
version = "0.1.0"
description = "Lifelong multi-robot path finding on factory-floor grids, with a collision-free invariant checked on every tick."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guilhem Carmouze" }]
dependencies = []

[project.optional-dependencies]
viz = ["pillow>=10.1", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.16,<0.17", "pillow>=10.1", "matplotlib>=3.8"]

[project.scripts]
amr-traffic-lab = "amr_traffic_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amr_traffic_lab = ["maps/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long seeded sweeps (deselected in CI with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
